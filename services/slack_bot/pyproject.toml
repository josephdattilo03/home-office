[project]
name = "slack_bot"
version = "0.1.0"
description = "Slack entrypoint"
requires-python = ">=3.13"
dependencies = [
    "core",
    "contracts",
    "slack-bolt>=1.30.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
core = { workspace = true }
contracts = { workspace = true }
